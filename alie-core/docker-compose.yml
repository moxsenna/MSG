version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alie-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alie_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: alie-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  mailpit:
    image: axllent/mailpit
    container_name: alie-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

  minio:
    image: minio/minio
    container_name: alie-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  adminer:
    image: adminer
    container_name: alie-adminer
    ports:
      - "8080:8080"
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
